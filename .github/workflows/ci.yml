name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '\.pb\.go$'))"
      - name: Check generated gRPC code is up to date
        run: |
          sudo apt-get install -y protobuf-compiler >/dev/null
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          make proto
          git diff --exit-code -I '^//.*protoc' -- proto/
      - name: Vet
        run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Test (race detector)
        run: go test -race -count=1 ./...
      - name: Build
        run: go build -o bin/blockchain .
